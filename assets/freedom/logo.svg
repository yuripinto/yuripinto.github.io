<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 56" width="56" height="56" role="img" aria-label="Freedom">
  <!-- a haste é o eixo do gráfico; os braços são duas barras que crescem de
       baixo para cima, e a de cima, a que cresceu, vem no verde de "boa" -->
  <rect width="56" height="56" rx="12" fill="#1b2a4a"/>
  <rect x="12" y="10" width="8" height="36" rx="4" fill="#ffffff"/>
  <rect x="23" y="22" width="14" height="8" rx="4" fill="#ffffff"/>
  <rect x="23" y="10" width="21" height="8" rx="4" fill="#2fbf7c"/>
</svg>
